name: CI/CD

# PR: valida (typecheck, lint, testes, build da imagem) sem publicar nada.
# Push na main: valida, publica a imagem no GHCR e faz o deploy no Render.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execucao antiga. Na main nada e
# cancelado, para nao interromper um deploy no meio.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  qualidade:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Gera os tipos de rota do Next (LayoutProps, PageProps) antes do tsc.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Bloqueia vulnerabilidade alta ou critica no que vai para producao.
      # Dependencias de desenvolvimento (ESLint, Vitest) ficam de fora porque
      # nao entram na imagem; hoje o braces, via eslint-config-next, nao tem correcao.
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev --audit-level=high

  imagem:
    name: Imagem Docker
    needs: qualidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
      - uses: actions/checkout@v6

      # Sem a variavel, a imagem publicada apontaria para localhost.
      - name: Conferir URL da API
        if: github.event_name == 'push'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Defina a variavel API_URL em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      # O GHCR exige nome em minusculas (VemVindo -> vemvindo).
      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Em PR so prova que a imagem builda; publica apenas na main.
          push: ${{ github.event_name == 'push' }}
          # URL publica da API (variavel do repositorio, nao segredo).
          # Em PR sem a variavel, cai no default do Dockerfile (localhost).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL || 'http://localhost:8000' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy no Render
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Sobe exatamente a imagem testada neste commit, e nao "a ultima".
      - name: Disparar deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGEM: ${{ needs.imagem.outputs.imagem }}:sha-${{ github.sha }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${IMAGEM}" \
            "${RENDER_DEPLOY_HOOK}"
